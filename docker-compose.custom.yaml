# Overlay que construye la imagen desde ESTE fork (incluye custom/ + application.rb).
# No modifica docker-compose.production.yaml, así los merges de upstream no chocan.
#
# Build + deploy:
#   docker compose -f docker-compose.production.yaml -f docker-compose.custom.yaml up -d --build
#
# rails construye la imagen; sidekiq reutiliza el mismo tag ya construido.
services:
  rails:
    image: chatwoot-custom:4.16.2
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production

  sidekiq:
    image: chatwoot-custom:4.16.2
